; PlatformIO build for the Si5351A VFO firmware (alternative to the Arduino IDE).
; Uses the same megaTinyCore 2.6.11 that the Arduino board package ships.
[platformio]
src_dir = Si5351AVFO

[env:attiny3226]
platform = atmelmegaavr
board = ATtiny3226
framework = arduino
board_build.f_cpu = 8000000L
board_hardware.oscillator = internal
; Optiboot occupies the first 512 B; the app is linked after it.
board_hardware.bootloader = optiboot
board_upload.maximum_size = 32256
upload_protocol = arduino
upload_speed = 115200
lib_deps =
  https://github.com/etherkit/Si5351Arduino.git#1c7199f
